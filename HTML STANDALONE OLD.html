
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Editor Workout</title>
<style>
body {
  font-family: sans-serif;
  margin: 20px;
  background: #f8f8f8;
}
h2 { margin-bottom: 10px; }
.toolbar {
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  position: relative; 
}
.toolbar button {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  cursor: pointer;
}
/* Bottone Colore */
#colorBtn {
background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff);
  color: #000000;
  font-weight: bold;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 5px 8px;
  cursor: pointer;
}
.color-menu .color-item {
  padding: 4px 6px;      
  border-radius: 3px;    
  border: none;          
  font-size: 12px;
  background: transparent;
}
/* Bottone Reset Colore */
button[onclick="resetColor()"] {
  background: #000000;
  color: #000000;
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 5px 8px;
  cursor: pointer;
}
#editor {
  border: 1px solid #ccc;
  padding: 10px;
  min-height: 300px;
  background: #fff;
}
#html-output {
  width: 100%;
  height: 200px;
  margin-top: 20px;
  font-family: monospace;
}

/* =========================
   TEXT COLOR CLASSES
   ========================= */
.text-red { color: #F44336; }
.text-pink { color: #E91E63; }
.text-purple { color: #9C27B0; }
.text-deep-purple { color: #673AB7; }
.text-indigo { color: #3F51B5; }
.text-blue { color: #2196F3; }
.text-light-blue { color: #03A9F4; }
.text-cyan { color: #00BCD4; }
.text-teal { color: #009688; }
.text-green { color: #4CAF50; }
.text-light-green { color: #8BC34A; }
.text-lime { color: #CDDC39; }
.text-yellow { color: #FFEB3B; }
.text-amber { color: #FFC107; }
.text-orange { color: #FF9800; }
.text-deep-orange { color: #FF5722; }
.text-brown { color: #795548; }
.text-blue-grey { color: #607D8B; }
.text-grey { color: #9E9E9E; }

/* GENERATED COLOR CLASSES - Will be added by JavaScript */

/* =========================
   COLOR MENU
   ========================= */
.color-menu {
  position: absolute;
  top: 40px;
  left: 0;
  background: #fff;
  border: 1px solid #ccc;
  padding: 8px;
  width: 200px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
  z-index: 100;
}
.hidden { display: none; }
.color-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: none;
  border: none;
  padding: 5px;
  cursor: pointer;
  font-size: 13px;
}
.color-item:hover { background: #f2f2f2; }
.swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,.2);
  flex-shrink: 0;
}

/* BG swatches */
.bg-red { background: #F44336; }
.bg-pink { background: #E91E63; }
.bg-purple { background: #9C27B0; }
.bg-deep-purple { background: #673AB7; }
.bg-indigo { background: #3F51B5; }
.bg-blue { background: #2196F3; }

.bg-yellow { background: #FFEB3B; }
.bg-amber { background: #FFC107; }
.bg-orange { background: #FF9800; }
.bg-deep-orange { background: #FF5722; }
.bg-brown { background: #795548; }
.bg-blue-grey { background: #607D8B; }

</head>

// ======= MENU DINAMICO COLORI PRINCIPALE (SOSTITUISCE IL VECCHIO) =======
const colorBtn = document.getElementById("colorBtn");
const colorMenu = document.getElementById("colorMenu");

function createColorMenu() {
  colorMenu.innerHTML = "";
  Object.keys(COLORS).forEach(colorGroup => {
    // Bottone gruppo principale
    const groupBtn = document.createElement("button");
    groupBtn.className = "color-item";
    groupBtn.style.fontWeight = "bold";
    groupBtn.innerHTML = `<span>${colorGroup}</span><span class=\"swatch\" style=\"background:${COLORS[colorGroup][1]}\"></span>`;
    groupBtn.onclick = function(e) {
      e.stopPropagation();
      // Toggle sottomenu
      const sub = this.nextSibling;
      if (sub.style.display === "block") sub.style.display = "none";
      else sub.style.display = "block";
    };
    colorMenu.appendChild(groupBtn);
    // Sottomenu
    const subMenu = document.createElement("div");
    subMenu.style.display = "none";
    subMenu.style.marginLeft = "10px";
    COLORS[colorGroup].forEach((val, i, arr) => {
      if (i % 2 === 0) {
        const shade = arr[i];
        const hex = arr[i+1];
        const shadeBtn = document.createElement("button");
        shadeBtn.className = "color-item";
        shadeBtn.style.width = "90%";
        shadeBtn.innerHTML = `<span>${colorGroup}-${shade}</span><span class=\"swatch\" style=\"background:${hex}\"></span>`;
        shadeBtn.onclick = function() {
          applyColorClass(`text-${colorGroup}-${shade}`);
          colorMenu.classList.add("hidden");
        };
        subMenu.appendChild(shadeBtn);
      }
    });
    colorMenu.appendChild(subMenu);
  });
}

colorBtn.onclick = function() {
  createColorMenu();
  colorMenu.classList.toggle("hidden");
};
document.addEventListener("click", function(e) {
  if (!colorMenu.contains(e.target) && e.target !== colorBtn) {
    colorMenu.classList.add("hidden");
  }
});
/* ==================== FUNZIONI BASE ==================== */
function execCmd(cmd) { document.execCommand(cmd,false,null); updateOutput(); }
function clearEditor(){ document.getElementById("editor").innerHTML=""; updateOutput(); }
function copyHTML(){ const t=document.getElementById("html-output"); t.select(); document.execCommand("copy"); alert("HTML copiato!"); }
function resetColor() { const sel = window.getSelection(); if (!sel.rangeCount) return; const range = sel.getRangeAt(0); if (range.collapsed) return; const fragment = range.extractContents(); function removeTextClasses(node){ if(node.nodeType===1){ node.className=node.className.split(" ").filter(c=>!c.startsWith("text-")).join(" "); Array.from(node.childNodes).forEach(removeTextClasses); } } Array.from(fragment.childNodes).forEach(removeTextClasses); range.insertNode(fragment); updateOutput(); }
function applyColorClass(colorClass) { 
  const sel = window.getSelection(); 
  if (!sel.rangeCount) return; 
  const range = sel.getRangeAt(0); 
  if (range.collapsed) return; 
  
  const fragment = range.extractContents(); 
  
  function removeColorClasses(node) {
    if (node.nodeType === 1) { 
      // Elemento: rimuovi tutte le classi text-*
      node.className = node.className.split(" ").filter(c => !c.startsWith("text-")).join(" ");
      Array.from(node.childNodes).forEach(removeColorClasses); 
    }
  } 
  
  Array.from(fragment.childNodes).forEach(removeColorClasses); 
  
  const wrapper = document.createElement("span"); 
  wrapper.classList.add(colorClass); 
  wrapper.appendChild(fragment); 
  range.insertNode(wrapper); 
  
  sel.removeAllRanges(); 
  const newRange = document.createRange(); 
  newRange.selectNodeContents(wrapper); 
  sel.addRange(newRange); 
  updateOutput(); 
}
function updateOutput(){ document.getElementById("html-output").value=document.getElementById("editor").innerHTML; }

/* ==================== FUNZIONI TABELLA BASE ==================== */
function insertBasicTable() {
  const rows = parseInt(prompt("Numero righe:", "2"));
  const cols = parseInt(prompt("Numero colonne:", "2"));
  if (!rows || !cols) return;

  let html = "<table border='1' style='border-collapse:collapse;width:100%'>";
  for (let i = 0; i < rows; i++) {
    html += "<tr>";
    for (let j = 0; j < cols; j++) {
      html += "<td style='padding:6px'>Cella</td>";
    }
    html += "</tr>";
  }
  html += "</table><br>";

  document.execCommand("insertHTML", false, html);
  updateOutput();
}
